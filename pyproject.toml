[project]
name = "m5fc"
version = "0.1.0"
description = "Hierarchical demand forecasting on M5"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyarrow", "scipy", "statsforecast>=2.0", "lightgbm>=4.0", "matplotlib"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
